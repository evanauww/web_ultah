<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Untuk Kalila ✨</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
</head>
<body class="bg-gradient-to-b from-pink-500 to-purple-600 text-white flex flex-col justify-center items-center min-h-screen text-center">

  <!-- Bagian Pembuka -->
  <div data-aos="fade-up" class="px-6">
    <h1 class="text-4xl md:text-6xl font-bold mb-4">✨ Untuk Kalila ✨</h1>

    <p class="text-lg md:text-xl max-w-xl mx-auto mb-8 opacity-90">
      Sebelum kamu masuk, nikmati dulu halaman kecil ini.  
      Sebuah permulaan sederhana untuk kenangan yang penuh makna 💐
    </p>
     <p class="text-lg md:text-xl max-w-xl mx-auto mb-8 opacity-90">
      Mungkin ini bukan sebuah hal yang spesial 
      untukmu tapi dibaca semua ya dinikmati perjalanannya
    </p>
     <p class="text-lg md:text-xl max-w-xl mx-auto mb-8 opacity-90">
      selamat menikmati
    </p>
    <button 
      onclick="mulai()"
      class="bg-white text-pink-600 font-semibold px-6 py-3 rounded-full shadow-lg hover:bg-pink-100 transition-transform duration-300 hover:scale-105">
      🌸 Mulai Sekarang
    </button>
  </div>

  <!-- Efek animasi bunga jatuh -->
  <div id="flowers-container"></div>

  <script>
    // Efek bunga jatuh
    function createFlower() {
      const flower = document.createElement('div');
      flower.innerHTML = '🌸';
      flower.classList.add('flower');
      flower.style.left = Math.random() * 100 + 'vw';
      flower.style.animationDuration = Math.random() * 3 + 2 + 's';
      document.getElementById('flowers-container').appendChild(flower);
      setTimeout(() => flower.remove(), 5000);
    }
    setInterval(createFlower, 400);

    // CSS tambahan buat bunga
    const style = document.createElement('style');
    style.innerHTML = `
      .flower {
        position: fixed;
        top: -2rem;
        font-size: 1.5rem;
        animation: fall linear forwards;
        opacity: 0.9;
      }
      @keyframes fall {
        to {
          transform: translateY(110vh) rotate(360deg);
          opacity: 0;
        }
      }
    `;
    document.head.appendChild(style);

    // Fungsi tombol
    function mulai() {
      window.location.href = "main.html"; // arahkan ke halaman utama
    }

    // AOS inisialisasi
    document.addEventListener('DOMContentLoaded', () => {
      AOS.init();
    });
  </script>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
</body>
</html>
