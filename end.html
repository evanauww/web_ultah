<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Penutup</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-b from-purple-200 via-pink-100 to-white flex flex-col justify-center items-center min-h-screen text-center">

  <h1 class="text-3xl md:text-5xl font-bold mb-4 text-purple-700">🌸 Terima Kasih Sudah Membaca 🌸</h1>
  
  <p class="text-lg max-w-xl mb-8 text-gray-700">
    Setiap kata yang tertulis di halaman ini lahir dari niat baik dan ketulusan hati.  
    Semoga setiap doa yang terselip di sini membawa kebahagiaan, kedamaian, dan keberkahan dalam langkahmu.  
    🌷✨
  </p>

  <p class="text-base text-gray-500 italic mb-10">"Selamat ulang tahun, Kalila Bil Afwin tetap jadi versi terbaik dirimu."</p>

  <!-- Tombol kembali ke awal -->
  <button 
    onclick="window.location.href='start.html'" 
    class="bg-white text-purple-600 font-semibold px-6 py-3 rounded-full shadow-lg hover:scale-105 transition">
    ⬅️ Kembali ke Awal
  </button>

  <!-- Musik penutup -->
  <audio autoplay loop>
    <source src="assets/music/ending.mp3" type="audio/mpeg">
    Browser kamu tidak mendukung pemutar musik.
  </audio>

</body>
</html>
